name: yaraast

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install . yara-x==1.20.0
      - run: yaraast check . --no-compile
        working-directory: yaraast-example-project
      - run: yaraast test . --engine yara-x
        working-directory: yaraast-example-project
