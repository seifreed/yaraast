name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,conformance,lsp,visualization,serialization,performance]"

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz

      - name: Ruff check
        run: ruff check .

      - name: Black check
        run: black --check .

      - name: MyPy
        run: mypy .

      - name: Strict typing targets
        run: mypy --strict --follow-imports=skip yaraast/limits.py yaraast/shared/path_safety.py

      - name: Bandit
        run: bandit -r yaraast

      - name: Audit runtime dependencies
        run: pip-audit . --progress-spinner off

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/ --tb=short

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Verify wheel and sdist in clean environments
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          WHEEL=$(ls dist/*.whl)
          SDIST=$(ls dist/*.tar.gz)
          python -m venv .release-venv
          .release-venv/bin/pip install "${WHEEL}[lsp,visualization,serialization,performance]"
          python -m venv .sdist-venv
          .sdist-venv/bin/pip install "$SDIST"
          .release-venv/bin/pip check
          .sdist-venv/bin/pip check
          EXPECTED_VERSION=${RELEASE_TAG#v}
          WHEEL_VERSION=$(.release-venv/bin/python -c "from importlib.metadata import version; print(version('yaraast'))")
          SDIST_VERSION=$(.sdist-venv/bin/python -c "from importlib.metadata import version; print(version('yaraast'))")
          RUNTIME_VERSION=$(cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/.release-venv/bin/python" -c "import yaraast; print(yaraast.__version__)")
          test "$EXPECTED_VERSION" = "$WHEEL_VERSION"
          test "$EXPECTED_VERSION" = "$SDIST_VERSION"
          test "$EXPECTED_VERSION" = "$RUNTIME_VERSION"
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/.release-venv/bin/yaraast" --version
          "$GITHUB_WORKSPACE/.release-venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_readme_examples.py"
          WHEEL_PATH="$GITHUB_WORKSPACE/$WHEEL" SDIST_PATH="$GITHUB_WORKSPACE/$SDIST" .release-venv/bin/python - <<'PY'
          import os
          import tarfile
          import zipfile

          wheel = os.environ["WHEEL_PATH"]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "yaraast/__init__.py",
              "yaraast/py.typed",
              "yaraast/types/modules/vt.json",
              "yaraast/serialization/yara_ast.proto",
              "yaraast/serialization/yara_ast_pb2.pyi",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel missing package data: {sorted(missing)}")
          if any(name.startswith(("/", "\\")) for name in names):
              raise SystemExit("wheel contains an absolute path")

          sdist = os.environ["SDIST_PATH"]
          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = {name.split("/", 1)[-1] for name in archive.getnames()}
          missing = required - sdist_names
          if missing:
              raise SystemExit(f"sdist missing package data: {sorted(missing)}")
          PY
          .release-venv/bin/python - <<'PY'
          from importlib.resources import files
          from yaraast.types.module_loader import ModuleLoader

          package_root = files("yaraast")
          for relative in (
              "py.typed",
              "types/modules/vt.json",
              "serialization/yara_ast.proto",
              "serialization/yara_ast_pb2.pyi",
          ):
              if not package_root.joinpath(relative).is_file():
                  raise SystemExit(f"installed wheel missing package data: {relative}")
          if ModuleLoader().get_module("vt") is None:
              raise SystemExit("installed wheel failed to load the vt module")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  extension:
    name: Build VS Code extension
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vscode-yaraast
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-yaraast/package-lock.json

      - name: Install and audit locked dependencies
        run: |
          npm ci
          npm audit --audit-level=low

      - name: Package and verify VSIX
        run: |
          npx vsce package --out yaraast.vsix
          python3 scripts/verify_vsix.py yaraast.vsix

      - name: Upload extension artifact
        uses: actions/upload-artifact@v6
        with:
          name: extension-vsix
          path: vscode-yaraast/yaraast.vsix

  github-release:
    name: Create GitHub Release
    needs: [build, extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Download extension artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-vsix
          path: extension/

      - name: Generate release notes
        id: notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" "$PREV_TAG..$TAG" -- . ':!.planning')
          else
            CHANGES=$(git log --pretty=format:"- %s" -20 -- . ':!.planning')
          fi
          {
            echo "notes<<RELEASE_EOF"
            echo "## What's Changed"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "## Installation"
            echo ""
            echo '```bash'
            echo "pip install yaraast==${TAG#v}"
            echo '```'
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-initial}...$TAG"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            dist/*
            extension/*.vsix
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  publish-pypi:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/yaraast
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  finalize-release:
    name: Publish GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Publish the validated draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
