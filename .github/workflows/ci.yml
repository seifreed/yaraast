name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-24.04
            python-version: "3.11"
            arch: x64
          - os: ubuntu-24.04
            python-version: "3.12"
            arch: x64
          - os: ubuntu-24.04
            python-version: "3.13"
            arch: x64
          - os: ubuntu-24.04
            python-version: "3.14"
            arch: x64
          # Linux ARM64
          - os: ubuntu-24.04-arm
            python-version: "3.13"
            arch: arm64
          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            python-version: "3.13"
            arch: arm64
          # macOS x64 (Intel)
          - os: macos-15
            python-version: "3.13"
            arch: x64
          # Windows x64
          - os: windows-2022
            python-version: "3.13"
            arch: x64

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-${{ matrix.arch }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lsp,visualization,serialization,performance]"

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python -m pytest tests/ -o "addopts=" -n auto --tb=short -m "not integration"

  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,libyara,lsp,visualization,serialization,performance]"

      - name: Enforce configured coverage threshold
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python -m pytest tests/ --tb=short

  integration-visualization:
    name: Graphviz integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,visualization]"

      - name: Render a real graph
        run: |
          python -m pytest tests/test_metrics_dependency_graph_graphviz_utils_more5.py -o "addopts=" -m integration --tb=short

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lsp,visualization,serialization,performance]"

      - name: Ruff check
        run: ruff check .

      - name: Black check
        run: black --check .

      - name: MyPy
        run: mypy .

      - name: Bandit
        run: bandit -r yaraast

      - name: Audit runtime dependencies
        run: pip-audit . --progress-spinner off

  conformance:
    name: Differential conformance gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies with both reference engines
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,conformance]"

      - name: Run conformance gates (YARA + YARA-X + YARA-L)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python -m pytest tests/test_conformance_differential.py tests/test_conformance_yarax.py tests/test_conformance_yaral.py tests/test_conformance_invalid.py -o "addopts=" --tb=short

  performance:
    name: Performance regression gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lsp,performance]"

      - name: Gate parser, generator, and LSP runtime
        run: |
          python scripts/benchmark_parser_runtime.py benchmark-results/parser.json
          python scripts/benchmark_lsp_runtime.py benchmark-results/lsp.json

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: benchmark-results/

  fuzz:
    name: Atheris parser fuzzing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install fuzzer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fuzz]"

      - name: Fuzz parser, generator, and reparse path
        run: |
          python -m fuzz.run_parser_fuzz fuzz/corpus/parser -atheris_runs=10000 -max_len=65536 -timeout=5

  mutation:
    name: Parser, lexer, and codegen mutation gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install mutation tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mutation,serialization]"

      - name: Run mutation gate
        run: |
          mutmut run --max-children 4
          mutmut export-cicd-stats
          python scripts/check_mutation_results.py mutants/mutmut-cicd-stats.json --minimum-score 75

      - name: Upload mutation report
        uses: actions/upload-artifact@v6
        with:
          name: mutation-results
          path: mutants/mutmut-cicd-stats.json

  extension:
    name: VS Code extension
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vscode-yaraast
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-yaraast/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Lint and compile
        run: |
          npm run lint
          npm run compile

      - name: Package and verify VSIX
        run: |
          npx vsce package --out /tmp/yaraast.vsix
          python3 scripts/verify_vsix.py /tmp/yaraast.vsix
