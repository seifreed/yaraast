name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-24.04
            python-version: "3.11"
            arch: x64
          - os: ubuntu-24.04
            python-version: "3.12"
            arch: x64
          - os: ubuntu-24.04
            python-version: "3.13"
            arch: x64
          - os: ubuntu-24.04
            python-version: "3.14"
            arch: x64
          # Linux ARM64
          - os: ubuntu-24.04-arm
            python-version: "3.13"
            arch: arm64
          # macOS ARM64 (Apple Silicon)
          - os: macos-15
            python-version: "3.13"
            arch: arm64
          # macOS x64 (Intel)
          - os: macos-15-intel
            python-version: "3.13"
            arch: x64
          # Windows x64
          - os: windows-2022
            python-version: "3.13"
            arch: x64

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify macOS architecture
        if: startsWith(matrix.os, 'macos')
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          python - <<'PY'
          import os
          import platform

          expected = {"arm64": "arm64", "x64": "x86_64"}[os.environ["EXPECTED_ARCH"]]
          actual = platform.machine().lower()
          if actual != expected:
              raise SystemExit(f"expected {expected}, runner reported {actual}")
          print(f"verified macOS architecture: {actual}")
          PY

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-${{ matrix.arch }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-pip-

      - name: Install dependencies
        uses: ./.github/actions/setup-uv
        with:
          extras: --extra dev --extra lsp --extra visualization --extra serialization --extra performance

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\.venv\Scripts;$env:PATH"
          python -m pytest tests/ -o "addopts=" -n auto --tb=short -m "not integration"

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python -m pytest tests/ -o "addopts=" -n auto --tb=short -m "not integration"

  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz

      - name: Install dependencies
        uses: ./.github/actions/setup-uv
        with:
          extras: --extra dev --extra libyara --extra lsp --extra visualization --extra serialization --extra performance

      - name: Enforce configured coverage threshold
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python -m pytest tests/ --tb=short

  integration-visualization:
    name: Graphviz integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz

      - name: Install dependencies
        uses: ./.github/actions/setup-uv
        with:
          extras: --extra dev --extra visualization

      - name: Render a real graph
        run: |
          python -m pytest tests/test_metrics_dependency_graph_graphviz_utils_more5.py -o "addopts=" -m integration --tb=short

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        uses: ./.github/actions/setup-uv
        with:
          extras: --extra dev --extra lsp --extra visualization --extra serialization --extra performance

      - name: Ruff check
        run: ruff check .

      - name: Black check
        run: black --check .

      - name: MyPy
        run: mypy .

      - name: Strict typing targets
        run: mypy --strict --follow-imports=skip yaraast/limits.py yaraast/shared/path_safety.py yaraast/api.py

      - name: Strict parser typing
        run: mypy --strict --follow-imports=skip yaraast/errors.py yaraast/parser/*.py

      - name: Strict codegen typing
        run: mypy --strict --follow-imports=skip yaraast/errors.py yaraast/visitor/visitor.py yaraast/codegen/*.py

      - name: Bandit
        run: bandit -r yaraast

      - name: Audit runtime dependencies
        run: pip-audit . --progress-spinner off

  conformance:
    name: Differential conformance gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies with both reference engines
        uses: ./.github/actions/setup-uv
        with:
          extras: --extra dev --extra conformance

      - name: Run conformance gates (YARA + YARA-X + YARA-L)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python -m pytest tests/test_conformance_differential.py tests/test_conformance_yarax.py tests/test_conformance_yaral.py tests/test_conformance_invalid.py -o "addopts=" --tb=short

  performance:
    name: Performance regression gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        uses: ./.github/actions/setup-uv
        with:
          extras: --extra dev --extra lsp --extra performance

      - name: Gate parser, generator, and LSP runtime
        run: |
          python scripts/benchmark_parser_runtime.py benchmark-results/parser.json --samples 5
          python scripts/benchmark_lsp_runtime.py benchmark-results/lsp.json

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: benchmark-results/

  fuzz:
    name: Atheris parser fuzzing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install fuzzer
        uses: ./.github/actions/setup-uv
        with:
          extras: --extra fuzz

      - name: Fuzz parser acceptance
        run: |
          python -m fuzz.run_parser_fuzz fuzz/corpus/parser -atheris_runs=10000 -max_len=65536 -timeout=5

      - name: Fuzz accepted-input round trips
        run: |
          python -m fuzz.run_roundtrip_fuzz fuzz/corpus/roundtrip -atheris_runs=10000 -max_len=65536 -timeout=5

  mutation:
    name: Parser, lexer, and codegen mutation gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install mutation tooling
        uses: ./.github/actions/setup-uv
        with:
          extras: --extra dev --extra mutation --extra serialization

      - name: Run mutation gate
        run: |
          mutmut run --max-children 4
          mutmut export-cicd-stats
          python scripts/check_mutation_results.py mutants/mutmut-cicd-stats.json --minimum-score 75

      - name: Upload mutation report
        uses: actions/upload-artifact@v6
        with:
          name: mutation-results
          path: mutants/mutmut-cicd-stats.json

  extension:
    name: VS Code extension
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vscode-yaraast
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-yaraast/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Lint and compile
        run: |
          npm run lint
          npm run compile

      - name: Package and verify VSIX
        run: |
          npx vsce package --out /tmp/yaraast.vsix
          python3 scripts/verify_vsix.py /tmp/yaraast.vsix
